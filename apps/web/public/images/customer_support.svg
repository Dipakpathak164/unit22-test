<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fa0d13" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#fa0d13" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Screen Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Red Accent Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fa0d13"/>
      <stop offset="100%" stop-color="#b9070c"/>
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a2e2b"/>
      <stop offset="100%" stop-color="#2a1614"/>
    </linearGradient>

    <!-- Skin Tone Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8d5c2"/>
      <stop offset="100%" stop-color="#eaaf96"/>
    </linearGradient>

    <!-- Headset Metallic Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="50%" stop-color="#9ca3af"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
    </filter>

    <style>
      @keyframes soundPulse {
        0%, 100% { transform: scale(1); opacity: 0.4; }
        50% { transform: scale(1.25); opacity: 0.9; }
      }
      @keyframes floatSoft {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes waveBar {
        0%, 100% { height: 12px; }
        50% { height: 28px; }
      }
      .sound-ring-1 { animation: soundPulse 2s infinite ease-in-out; transform-origin: 430px 245px; }
      .sound-ring-2 { animation: soundPulse 2s infinite ease-in-out 0.4s; transform-origin: 430px 245px; }
      .float-badge { animation: floatSoft 4s infinite ease-in-out; }
      .wb-1 { animation: waveBar 1.2s infinite ease-in-out; }
      .wb-2 { animation: waveBar 1.2s infinite ease-in-out 0.3s; }
      .wb-3 { animation: waveBar 1.2s infinite ease-in-out 0.6s; }
      .wb-4 { animation: waveBar 1.2s infinite ease-in-out 0.9s; }
    </style>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="400" cy="300" r="280" fill="url(#bgGlow)"/>

  <!-- Background Decorative Tech Dashboard Screen Frame -->
  <rect x="80" y="70" width="300" height="200" rx="12" fill="url(#screenGrad)" stroke="#3f3f46" stroke-width="2" filter="url(#dropShadow)"/>
  
  <!-- Screen Header Bar -->
  <path d="M80 82 C80 75 85 70 92 70 L368 70 C375 70 380 75 380 82 L380 100 L80 100 Z" fill="#18181b"/>
  <circle cx="100" cy="85" r="4" fill="#ef4444"/>
  <circle cx="114" cy="85" r="4" fill="#f59e0b"/>
  <circle cx="128" cy="85" r="4" fill="#10b981"/>
  <text x="145" y="89" fill="#a1a1aa" font-family="monospace" font-size="11" font-weight="bold">UNIT 22 RIDER DESK v2.4</text>

  <!-- Dashboard UI Elements on Screen -->
  <!-- Active Call Indicator Box -->
  <rect x="100" y="115" width="260" height="42" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
  <circle cx="120" cy="136" r="6" fill="#10b981"/>
  <text x="135" y="134" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">ACTIVE CALL — INCOMING RIDER</text>
  <text x="135" y="147" fill="#a1a1aa" font-family="monospace" font-size="10">Caller: +91 98765 43210 (Interceptor 650)</text>

  <!-- Mini Audio Waveform Visualizer on Screen -->
  <g fill="#fa0d13">
    <rect class="wb-1" x="100" y="180" width="4" height="16" rx="2"/>
    <rect class="wb-2" x="108" y="174" width="4" height="24" rx="2"/>
    <rect class="wb-3" x="116" y="170" width="4" height="30" rx="2"/>
    <rect class="wb-4" x="124" y="178" width="4" height="20" rx="2"/>
    <rect class="wb-2" x="132" y="172" width="4" height="26" rx="2"/>
    <rect class="wb-1" x="140" y="182" width="4" height="14" rx="2"/>
  </g>
  <text x="155" y="190" fill="#e4e4e7" font-family="sans-serif" font-size="11" font-weight="600">Fitment Consultation in Progress...</text>

  <!-- Screen 2 (Right Background Monitor) -->
  <rect x="520" y="100" width="200" height="150" rx="10" fill="url(#screenGrad)" stroke="#3f3f46" stroke-width="2"/>
  <rect x="535" y="120" width="170" height="18" rx="4" fill="#fa0d13" fill-opacity="0.2"/>
  <text x="542" y="133" fill="#fa0d13" font-family="monospace" font-size="10" font-weight="bold">PARTS CATALOGUE CHECK</text>
  <rect x="535" y="148" width="110" height="10" rx="3" fill="#3f3f46"/>
  <rect x="535" y="164" width="140" height="10" rx="3" fill="#27272a"/>
  <rect x="535" y="180" width="90" height="10" rx="3" fill="#27272a"/>

  <!-- ================= CHARACTER ILLUSTRATION ================= -->

  <!-- Body / Torso (Polo Shirt with Collar) -->
  <path d="M280 580 C280 470 340 430 430 430 C520 430 580 470 580 580 Z" fill="#18181b"/>
  <!-- Shirt Collar Accent -->
  <path d="M385 430 L430 490 L475 430 L450 430 L430 460 L410 430 Z" fill="#fa0d13"/>
  <!-- Unit 22 Logo Badge on Shirt -->
  <rect x="470" y="470" width="48" height="20" rx="4" fill="#fa0d13"/>
  <text x="475" y="484" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="900">UNIT 22</text>

  <!-- Neck -->
  <rect x="405" y="370" width="50" height="70" rx="10" fill="url(#skinGrad)"/>
  <!-- Neck Shadow -->
  <path d="M405 400 C430 420 455 420 455 400 L455 435 L405 435 Z" fill="#d4947a" opacity="0.4"/>

  <!-- Hair Back / Bun -->
  <circle cx="490" cy="300" r="65" fill="url(#hairGrad)"/>

  <!-- Head / Face Structure -->
  <path d="M375 260 C375 190 485 190 485 260 C485 340 445 375 430 375 C415 375 375 340 375 260 Z" fill="url(#skinGrad)"/>

  <!-- Hair Front Style (Sleek Modern Waves) -->
  <path d="M370 240 C380 180 470 170 495 220 C470 200 400 205 380 260 Z" fill="url(#hairGrad)"/>
  <path d="M430 180 C480 180 505 210 500 270 C485 230 450 200 430 180 Z" fill="url(#hairGrad)"/>

  <!-- Ears -->
  <circle cx="378" cy="290" r="14" fill="url(#skinGrad)"/>
  <circle cx="378" cy="290" r="8" fill="#d4947a" opacity="0.3"/>

  <!-- Eyebrows -->
  <path d="M390 252 Q405 246 418 252" stroke="#2a1614" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M440 252 Q453 246 466 252" stroke="#2a1614" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Eyes (Expressive & Friendly) -->
  <ellipse cx="404" cy="268" rx="8" ry="9" fill="#2a1614"/>
  <ellipse cx="454" cy="268" rx="8" ry="9" fill="#2a1614"/>
  <!-- Eye Highlights -->
  <circle cx="402" cy="265" r="2.5" fill="#ffffff"/>
  <circle cx="452" cy="265" r="2.5" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M428 275 Q433 290 426 295" stroke="#d4947a" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Cheeks (Blush) -->
  <ellipse cx="395" cy="288" rx="10" ry="5" fill="#fa0d13" opacity="0.15"/>
  <ellipse cx="460" cy="288" rx="10" ry="5" fill="#fa0d13" opacity="0.15"/>

  <!-- Smile (Warm & Welcoming) -->
  <path d="M410 315 Q430 335 450 315" fill="#fa0d13" opacity="0.85"/>
  <path d="M410 315 Q430 335 450 315 Z" fill="#ffffff"/>
  <path d="M408 314 Q430 326 452 314" stroke="#c0392b" stroke-width="2" fill="none"/>

  <!-- ================= HEADSET & MICROPHONE ================= -->

  <!-- Headset Headband -->
  <path d="M368 285 C360 210 420 160 480 220" stroke="url(#metalGrad)" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Ear Cushion / Earpiece (Left) -->
  <rect x="358" y="265" width="20" height="50" rx="10" fill="#18181b" stroke="#fa0d13" stroke-width="2.5" filter="url(#dropShadow)"/>
  <rect x="363" y="275" width="10" height="30" rx="5" fill="#3f3f46"/>

  <!-- Microphone Boom Arm -->
  <path d="M368 300 Q365 345 425 340" stroke="url(#metalGrad)" stroke-width="4.5" stroke-linecap="round" fill="none"/>

  <!-- Microphone Capsule -->
  <rect x="420" y="332" width="20" height="15" rx="7" fill="#18181b" stroke="#fa0d13" stroke-width="2"/>

  <!-- Sound/Voice Emission Waves (Animated) -->
  <circle class="sound-ring-1" cx="430" cy="340" r="22" stroke="#fa0d13" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  <circle class="sound-ring-2" cx="430" cy="340" r="34" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>

  <!-- Floating Call Desk Badge -->
  <g class="float-badge">
    <rect x="520" y="310" width="220" height="60" rx="10" fill="#ffffff" filter="url(#dropShadow)"/>
    <circle cx="548" cy="340" r="16" fill="#10b981" fill-opacity="0.15"/>
    <path d="M542 340 C542 334 547 330 554 336 C556 338 556 342 554 344 L550 348 C548 350 544 350 542 348 Z" fill="#10b981"/>
    <text x="575" y="335" fill="#18181b" font-family="sans-serif" font-size="12" font-weight="900">EXPRESS CALL DESK</text>
    <text x="575" y="352" fill="#10b981" font-family="monospace" font-size="11" font-weight="bold">● ONLINE & CONNECTED</text>
  </g>

</svg>
